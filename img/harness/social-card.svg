<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Coding harness social preview</title>
  <desc id="description">Three luminous strands beside a bounded engineering-work message.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8dffe0" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="22%" r="65%">
      <stop offset="0" stop-color="#8469ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#07110f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#07110f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(82 90) scale(2.35)">
    <rect x="5" y="5" width="54" height="54" rx="14" fill="#101412" stroke="#34483a" stroke-width="2"/>
    <g fill="none" stroke-linecap="round" stroke-width="5.5">
      <path d="M19 14c0 10 26 8 26 18S19 40 19 50" stroke="#a6f57b"/>
      <path d="M32 14c0 8-13 10-13 18s13 10 13 18" stroke="#d9ffd0"/>
      <path d="M45 14c0 10-13 8-13 18s13 8 13 18" stroke="#639e57"/>
    </g>
  </g>
  <text x="84" y="300" fill="#8dffe0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="680" letter-spacing="4">DAEMONLOOM / CODING HARNESS</text>
  <text x="82" y="390" fill="#edf6f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="560" letter-spacing="-3">ENGINEER THROUGH IT.</text>
  <text x="82" y="458" fill="#b9ff49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="460" letter-spacing="-3">KEEP EVERY MOVE ATTRIBUTABLE.</text>
  <path d="M84 530H1116" stroke="#8dffe0" stroke-opacity=".22"/>
  <text x="84" y="568" fill="#72867f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" letter-spacing="3">TASK-FIT WORKSPACE · CAPABILITIES · CONTROLS · EVIDENCE</text>
</svg>
